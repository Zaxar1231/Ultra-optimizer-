name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Parse all scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts, . -Filter *.ps1) {
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Severity Error, Warning -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: UI smoke test (renders every page in both themes)
        shell: pwsh
        run: |
          $p = Start-Process dist/UltimateOptimizer.exe -ArgumentList '--screenshots', "$PWD/screenshots" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'killed after 4 min' }
          if (Test-Path screenshots/progress.txt) { Get-Content screenshots/progress.txt }
          if (Test-Path screenshots/error.txt) { Get-Content screenshots/error.txt; exit 1 }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-ChildItem screenshots | Format-Table Name, Length

      - name: Self-update test (download latest release over a copy, verify SHA-256, swap exe)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'update-test'
          New-Item $t -ItemType Directory -Force | Out-Null
          Copy-Item dist/UltimateOptimizer.exe $t
          $p = Start-Process "$t/UltimateOptimizer.exe" -ArgumentList '--update-selftest', "$t/result.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'timeout' }
          Get-Content "$t/result.txt"
          if ($p.ExitCode -ne 0) { throw 'self-update failed' }
          if (-not (Test-Path "$t/UltimateOptimizer.exe.old")) { throw 'previous exe was not kept as .old' }
          $sums = Invoke-RestMethod "https://github.com/${{ github.repository }}/releases/latest/download/SHA256SUMS.txt"
          $want = ([regex]::Match($sums, '(?m)^([0-9a-f]{64})\s+UltimateOptimizer\.exe')).Groups[1].Value
          $got = (Get-FileHash "$t/UltimateOptimizer.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "swapped exe: $got / release: $want"
          if ($got -ne $want) { throw 'swapped exe does not match the release' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*

      - uses: actions/upload-artifact@v4
        with:
          name: UltimateOptimizer
          path: dist/*
