name: Release

# Publishes a release when:
#  - a tag vX.Y.Z is pushed, or
#  - VERSION changes on the default branch (the tag is created automatically), or
#  - it is started by hand (Actions -> Release -> Run workflow)
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($v)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          # branch push: don't rebuild a version that is already released
          $exists = $false
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            $exists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0   # "not found" must not fail this step
          }
          "skip=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "v$v is already released - nothing to do"; exit 0 }
          # release notes = this version's section of CHANGELOG.md
          $md = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?ms)^## v$([regex]::Escape($v))\s*\r?\n(.*?)(?=^## v|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Ultimate Optimizer v$v" }
          $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/docs/screenshots"
          if (Test-Path docs/screenshots/home-dark.png) {
            $notes += "`n`n### Скриншоты`n`n![Главная]($raw/home-dark.png)`n`n| | |`n|---|---|`n| ![Оптимизация]($raw/optimize-light.png) | ![Журнал]($raw/log-dark.png) |`n| ![Инструменты]($raw/tools-dark.png) | ![Обновление]($raw/update-light.png) |"
          }
          $notes += "`n`n---`n**Как запустить:** скачай ``UltimateOptimizer.exe`` → запусти → «Да» в окне UAC. Дальше приложение обновляется само.`nSmartScreen: «Подробнее» → «Выполнить в любом случае» (файл не подписан сертификатом).`nКонтрольные суммы — в ``SHA256SUMS.txt``."
          Set-Content release-notes.md $notes -Encoding UTF8

      - name: Build (Windows PowerShell 5.1 + csc from .NET Framework)
        if: steps.ver.outputs.skip != 'true'
        shell: powershell
        run: ./build.ps1

      - name: UI smoke test (renders every page in both themes)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process dist/UltimateOptimizer.exe -ArgumentList '--screenshots', "$PWD/screenshots" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'killed after 4 min' }
          if (Test-Path screenshots/progress.txt) { Get-Content screenshots/progress.txt }
          if (Test-Path screenshots/error.txt) { Get-Content screenshots/error.txt; exit 1 }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-ChildItem screenshots | Format-Table Name, Length

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ultimate Optimizer v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/UltimateOptimizer.exe
            dist/UltimateOptimizer-v${{ steps.ver.outputs.version }}.zip
            dist/SHA256SUMS.txt
